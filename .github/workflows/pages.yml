name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build and verify offline dictionary
        run: npm test

      - name: Stamp service-worker cache version
        run: node scripts/stamp_service_worker.js

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Source files the app never loads stay in the repository but out of
      # the site, which GitHub Pages limits to 1 GB.
      - name: Leave build sources out of the site
        run: |
          rm -rf app/assets/vocab-scenes/*-sheets app/assets/listening/a1/figures/sheets
          # Phonetik figure sheets: PHONETIK_A1_FIGURES is empty, the pages show the book scans
          rm -rf app/assets/listening/a1-phonetik/figures
          rm -f app/data_dictionary_de_ar.js
          size=$(du -sm app | cut -f1)
          echo "Site: ${size} MB of GitHub Pages' 1 GB"
          # a larger site fails to publish; stop here and keep the live one
          if [ "$size" -ge 1000 ]; then echo "::error::The site is ${size} MB, over the 1 GB Pages limit"; exit 1; fi
          if [ "$size" -ge 950 ]; then echo "::warning::The site is ${size} MB, close to the 1 GB Pages limit"; fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: app

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

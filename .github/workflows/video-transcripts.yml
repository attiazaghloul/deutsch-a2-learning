name: Video transcripts

# This no longer works, and is kept only to try the runners again: on 20
# November 2026 every video answered "Sign in to confirm you're not a bot"
# here, so the run fetched nothing at all, German included. YouTube blocks
# GitHub's runners the same way it blocks our server, so the subtitles have to
# be fetched from a personal machine, where they still arrive:
#     pip install yt-dlp
#     python scripts/fetch_video_transcripts.py
#     git add app/data_videos && git commit && git push
# Automatic Arabic is refused there as well (HTTP 429), so new files carry
# German only; the app translates those lines itself. The push trigger is gone
# because a branch push must not turn red over a block that is not ours. Start
# a run by hand (Actions > Video transcripts > Run workflow) to find out
# whether the runners answer again.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: pip install yt-dlp==2026.10.26

      - name: Fetch the subtitles
        run: python scripts/fetch_video_transcripts.py

      - name: Commit the transcripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data_videos
          git diff --cached --quiet && exit 0
          git commit -m "Fetch the video transcripts"
          git push

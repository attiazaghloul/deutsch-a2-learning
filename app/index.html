<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#236b6d">
<title>Deutsch A2.2 · Netzwerk neu + Grammatik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Cairo";font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/cairo-400.ttf") format("truetype")}
@font-face{font-family:"Cairo";font-style:normal;font-weight:500;font-display:swap;src:url("assets/fonts/cairo-500.ttf") format("truetype")}
@font-face{font-family:"Cairo";font-style:normal;font-weight:600;font-display:swap;src:url("assets/fonts/cairo-600.ttf") format("truetype")}
@font-face{font-family:"Cairo";font-style:normal;font-weight:700;font-display:swap;src:url("assets/fonts/cairo-700.ttf") format("truetype")}
:root{
  --green:#287c79; --green-d:#175b5d; --green-l:#e5f3f0;
  --ink:#263238; --ink-2:#66757d; --bg:#f6f2ea; --card:#fffdf9;
  --amber:#c8893d; --amber-l:#fbefd9;
  --blue:#4c7194; --blue-l:#e9f0f6;
  --red:#b64b4b; --red-l:#f9e8e5;
  --ar:#716778; --ar-l:#f7f3f7;
  --line:#e6ded1;
  --radius:18px;
  --shadow:0 8px 24px rgba(49,65,68,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:"Carlito","Calibri","Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;
  padding-bottom:env(safe-area-inset-bottom);
}
.ar,[dir="rtl"],.ar-toggle span{font-family:"Cairo","Tahoma",sans-serif}
#app{max-width:780px;margin:0 auto;padding:0 14px 90px}
/* ---------- header ---------- */
header.topbar{
  position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#175b5d,#328986);color:#fff;
  margin:0 -14px 16px;padding:12px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow);
}
header.topbar .back{
  background:rgba(255,255,255,.18);border:none;color:#fff;font-size:20px;
  width:38px;height:38px;border-radius:12px;cursor:pointer;flex:0 0 auto;display:none;
}
body.has-back header.topbar .back{display:block}
header.topbar h1{font-size:17px;font-weight:700;flex:1;line-height:1.3}
header.topbar h1 small{display:block;font-size:11px;font-weight:400;opacity:.85}
/* Arabic toggle */
.ar-toggle{
  display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);
  border:1.5px solid rgba(255,255,255,.45);border-radius:999px;padding:6px 12px;
  color:#fff;cursor:pointer;font-size:13px;font-weight:700;user-select:none;flex:0 0 auto;
}
.ar-toggle .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.45);transition:.2s}
body.show-ar .ar-toggle{background:#fff;color:var(--green-d)}
body.show-ar .ar-toggle .dot{background:var(--green)}
/* ---------- Arabic blocks ---------- */
.ar{display:none;direction:rtl;text-align:right;color:var(--ar);
  background:var(--ar-l);border:1px solid #eee7ef;border-radius:9px;padding:5px 10px;margin-top:5px;
  font-size:.79em;font-weight:400;line-height:1.75}
.ar b,.ar strong{font-weight:500}
body.show-ar .ar{display:block}
span.ar{display:none;background:none;border:0;padding:0 4px;margin:0;border-radius:6px}
body.show-ar span.ar{display:inline}
/* ---------- cards & layout ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:20px;margin-bottom:16px;overflow:hidden}
.hero{background:linear-gradient(135deg,#175b5d 0%,#3b918b 100%);color:#fff;
  border-radius:var(--radius);padding:24px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
.hero h2{font-size:22px;margin-bottom:6px}
.hero p{font-size:14px;opacity:.95}
.hero .ar{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.14);color:rgba(255,255,255,.86)}
.section-label{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink-2);margin:22px 4px 10px}
/* lesson list */
.lesson-item{display:flex;align-items:center;gap:14px;background:var(--card);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;
  cursor:pointer;border:2px solid transparent;transition:.15s;width:100%;text-align:left;
  color:inherit;font:inherit}
.lesson-item:active{transform:scale(.98)}
.lesson-item:focus-visible,.tab:focus-visible,.btn:focus-visible,.ar-toggle:focus-visible,
header.topbar .back:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.lesson-item .num{flex:0 0 auto;width:46px;height:46px;border-radius:14px;background:var(--green-l);
  color:var(--green-d);font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center}
.lesson-thumb{width:76px;height:58px;object-fit:cover;border-radius:12px;flex:0 0 auto}
.lesson-item.gram .num{background:var(--blue-l);color:var(--blue)}
.lesson-item .ttl{flex:1}
.lesson-item .ttl b{font-size:16px;display:block}
.lesson-item .ttl span.sub{font-size:12.5px;color:var(--ink-2);display:block}
.lesson-item .chev{color:#c2cad3;font-size:20px}
/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;position:sticky;top:62px;z-index:40;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:none;background:var(--card);box-shadow:var(--shadow);color:var(--ink-2);
  padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer}
.tab.active{background:var(--green-d);color:#fff}
/* ---------- vocab ---------- */
.vocab-row{padding:13px 0;border-bottom:1px solid #edf0f3}
.vocab-row:last-child{border-bottom:none}
.vocab-row .w{font-weight:800;font-size:16.5px;color:var(--green-d)}
.vocab-row .w .art{color:var(--amber);font-weight:700}
.vocab-row .def{font-size:14px;color:var(--ink);margin-top:2px}
.vocab-row .def::before{content:"💡 ";font-size:12px}
.vocab-row .ex{font-size:13.5px;color:var(--ink-2);font-style:italic;margin-top:3px}
.vocab-row .ex::before{content:"„"}
.vocab-row .ex::after{content:"“"}
/* ---------- redemittel ---------- */
.rm-group{margin-bottom:16px}
.rm-group h4{background:var(--green-l);color:var(--green-d);display:inline-block;
  padding:4px 12px;border-radius:8px;font-size:14px;margin-bottom:8px}
.rm-item{padding:7px 0 7px 14px;border-left:3px solid var(--green-l);margin-bottom:6px;font-size:15px}
.rm-item .ar{margin-top:3px}
/* ---------- grammar ---------- */
.gram-block{margin-bottom:8px}
.gram-block h3{font-size:17px;color:var(--green-d);margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--green-l)}
.gram-block h5{font-size:14.5px;margin:14px 0 6px;color:var(--ink)}
.gram-block p{font-size:14.5px;margin-bottom:8px}
.exbox{background:var(--green-l);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:14.5px}
.exbox i,.exbox em{color:var(--green-d);font-style:normal;font-weight:700}
.notebox{background:var(--amber-l);border-left:4px solid var(--amber);border-radius:8px;
  padding:9px 13px;margin:10px 0;font-size:13.5px}
.notebox::before{content:"⚠️ ";}
table.gt{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px;background:#fff}
table.gt th{background:var(--green);color:#fff;padding:7px 8px;text-align:left;font-size:12.5px}
table.gt td{border:1px solid #e3e8ee;padding:6px 8px}
table.gt tr:nth-child(even) td{background:#f7faf3}
table.gt b{color:var(--green-d)}
.gt-wrap{overflow-x:auto;margin:0 -4px}
/* ---------- speaking ---------- */
.speak-q{display:flex;gap:10px;align-items:flex-start;background:var(--blue-l);
  border-radius:12px;padding:11px 14px;margin-bottom:9px;font-size:14.5px}
.speak-q .qicon{flex:0 0 auto}
.model-text{background:#fffceb;border:1.5px dashed var(--amber);border-radius:12px;
  padding:14px 16px;font-size:15px;line-height:1.85;margin-top:10px}
.model-text b{color:var(--amber);display:block;margin-bottom:6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
/* ---------- reading ---------- */
.reading-card h3{color:var(--green-d);font-size:19px;margin-bottom:2px}
.reading-kind{font-size:12px;color:var(--ink-2);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.reading-text{font-size:15px;line-height:1.9}
.reading-glossary{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.reading-glossary span{background:var(--blue-l);color:#173f8a;border-radius:9px;padding:5px 9px;font-size:12.5px}
.reading-q{border-top:1px solid #e8ecf0;padding:10px 0}
.reading-q b{display:block;font-size:14px;margin-bottom:6px}
.answer-btn{border:1px solid #cad4df;background:#fff;color:var(--green-d);border-radius:9px;padding:6px 10px;font-weight:700;cursor:pointer}
.reading-answer{display:none;background:var(--green-l);border-radius:9px;padding:8px 11px;margin-top:7px;font-size:14px}
.reading-answer.show{display:block}
/* ---------- main library tabs, dictionary and expressions ---------- */
.main-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.main-tab{border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:13px;
  padding:10px 6px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.main-tab.active{background:var(--green-d);border-color:var(--green-d);color:#fff}
.search-panel{position:sticky;top:72px;z-index:20;background:rgba(246,242,234,.96);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:14px;box-shadow:var(--shadow)}
.search-row{display:flex;gap:8px}
.library-search,.library-filter{border:2px solid #d7dfe3;background:#fff;border-radius:11px;padding:10px;
  color:var(--ink);font:inherit;outline:none}
.library-search{min-width:0;flex:1}
.library-filter{width:140px}
.library-search:focus,.library-filter:focus{border-color:var(--green)}
.result-count{font-size:12px;color:var(--ink-2);margin:7px 3px 0}
.dictionary-entry{display:grid;grid-template-columns:1fr auto;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.dictionary-entry:last-child{border-bottom:0}
.dictionary-word{font-size:17px;font-weight:800;color:var(--green-d)}
.dictionary-meta{font-size:11px;color:var(--ink-2);background:var(--green-l);border-radius:999px;padding:3px 8px;height:max-content}
.dictionary-definition{font-size:14px;margin-top:3px}
.dictionary-example{font-size:13px;color:var(--ink-2);font-style:italic;margin-top:3px}
.expression-card{border-left:4px solid var(--amber)}
.expression-de{font-size:18px;font-weight:800;color:var(--green-d)}
.expression-meaning{font-size:14px;margin-top:6px}
.expression-example{font-size:13px;color:var(--ink-2);font-style:italic;margin-top:7px}
.expression-tag{display:inline-block;background:var(--amber-l);color:#8b5b20;border-radius:999px;padding:3px 8px;
  font-size:11px;font-weight:700;margin-bottom:8px}
/* ---------- speech ---------- */
.listen-toggle{border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;
  border-radius:999px;padding:6px 9px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
body.listen-mode .listen-toggle{background:#fff;color:var(--green-d)}
.speakable{position:relative}
.speak-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;
  border-radius:50%;background:var(--blue-l);color:var(--blue);font-size:14px;cursor:pointer;margin-inline-start:7px;vertical-align:middle}
.speak-btn:hover,.speak-btn:focus-visible{background:var(--blue);color:#fff}
body.listen-mode .speakable{cursor:pointer;outline:1px dashed rgba(40,124,121,.35);outline-offset:3px}
.speech-status{position:fixed;left:50%;bottom:18px;z-index:90;transform:translate(-50%,120px);
  background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-size:12px;box-shadow:var(--shadow);
  transition:.2s;pointer-events:none;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speech-status.show{transform:translate(-50%,0)}
.chapter-visual{padding:0}
.chapter-visual img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
/* ---------- grammar visuals and practice ---------- */
.grammar-visual{position:relative;padding:0;overflow:hidden}
.grammar-visual img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.visual-caption{padding:12px 16px;background:linear-gradient(90deg,var(--green-l),var(--card));
  color:var(--green-d);font-size:13.5px;font-weight:700}
.visual-caption .ar{font-weight:400;margin-top:5px}
.practice-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 4px 10px}
.practice-head h3{color:var(--green-d);font-size:18px}
.practice-progress{font-size:12px;color:var(--ink-2);background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:5px 10px;white-space:nowrap}
.exercise-card{border-left:4px solid var(--blue);overflow:visible}
.exercise-type{display:inline-block;color:var(--blue);background:var(--blue-l);border-radius:999px;
  padding:3px 9px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.exercise-prompt{font-size:16px;font-weight:700;margin-bottom:12px}
.exercise-input{width:100%;border:2px solid #d7dfe3;background:#fff;border-radius:12px;padding:11px 12px;
  font:inherit;color:var(--ink);outline:none}
.exercise-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(40,124,121,.12)}
.exercise-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.exercise-check,.exercise-reset{border:0;border-radius:10px;padding:9px 13px;font:inherit;font-weight:700;cursor:pointer}
.exercise-check{background:var(--green-d);color:#fff}
.exercise-reset{background:var(--blue-l);color:var(--blue)}
.exercise-feedback{display:none;border-radius:10px;padding:9px 11px;margin-top:10px;font-size:14px}
.exercise-feedback.show{display:block}
.exercise-feedback.correct{background:var(--green-l);color:var(--green-d)}
.exercise-feedback.wrong{background:var(--red-l);color:var(--red)}
.token-bank,.order-answer{display:flex;flex-wrap:wrap;gap:7px;min-height:46px;border-radius:12px;padding:9px}
.token-bank{background:var(--blue-l)}
.order-answer{background:#fff;border:2px dashed #c8d4dc;margin-top:9px}
.word-token{border:1px solid #c9d7df;background:#fff;color:var(--ink);border-radius:9px;padding:7px 10px;
  font:inherit;cursor:pointer;box-shadow:0 2px 5px rgba(30,55,60,.05)}
.word-token:disabled{opacity:.3;cursor:default}
.type-label-fill::after{content:"Lückentext"}
.type-label-order::after{content:"Wörter ordnen"}
.type-label-correct::after{content:"Fehler korrigieren"}
.type-label-transform::after{content:"Satz umformen"}
/* ---------- flashcards ---------- */
.fc-bar{display:flex;gap:10px;margin-bottom:14px}
.btn{border:none;border-radius:12px;padding:11px 18px;font-size:14.5px;font-weight:700;cursor:pointer}
.btn-green{background:var(--green);color:#fff}
.btn-ghost{background:var(--card);color:var(--ink-2);box-shadow:var(--shadow)}
.flashcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);min-height:230px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:26px;cursor:pointer;margin-bottom:14px;border:2px solid var(--green-l)}
.flashcard .big{font-size:24px;font-weight:800;color:var(--green-d)}
.flashcard .hint{font-size:12px;color:#9aa6b2;margin-top:14px}
.flashcard .fdef{font-size:15.5px;margin-top:8px}
.flashcard .fex{font-size:14px;color:var(--ink-2);font-style:italic;margin-top:8px}
.fc-nav{display:flex;gap:10px;justify-content:center;align-items:center}
.fc-nav .cnt{font-size:13px;color:var(--ink-2);min-width:64px;text-align:center;font-weight:700}
/* ---------- quiz ---------- */
.quiz-q{margin-bottom:6px;font-weight:700;font-size:15.5px}
.quiz-opt{display:block;width:100%;text-align:left;background:#f7f9fb;border:2px solid #e6ebf0;
  border-radius:12px;padding:11px 14px;font-size:14.5px;margin-bottom:8px;cursor:pointer;font-family:inherit}
.quiz-opt.correct{background:var(--green-l);border-color:var(--green);color:var(--green-d);font-weight:700}
.quiz-opt.wrong{background:var(--red-l);border-color:var(--red);color:var(--red)}
.quiz-fb{font-size:13.5px;margin:4px 0 10px;display:none}
.quiz-fb.show{display:block}
.quiz-score{text-align:center;font-size:17px;font-weight:800;color:var(--green-d);padding:10px}
/* overview */
.goal-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #e8ecf0;font-size:14.5px}
.goal-item:last-child{border:none}
.badge-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{background:var(--green-l);color:var(--green-d);font-size:12px;font-weight:700;border-radius:999px;padding:4px 11px}
.intro-note{background:var(--blue-l);border-radius:12px;padding:12px 15px;font-size:14px;margin-top:12px}
.gram-topic-link{display:flex;align-items:center;gap:10px;background:#f7f9fb;border-radius:12px;
  padding:11px 14px;margin-bottom:8px;cursor:pointer;font-weight:700;font-size:14.5px;border:2px solid transparent}
.gram-topic-link:active{border-color:var(--green)}
.gram-topic-link .gnum{background:var(--blue-l);color:var(--blue);border-radius:8px;padding:2px 9px;font-size:12.5px;flex:0 0 auto}
footer.fnote{text-align:center;font-size:12px;color:#9aa6b2;margin-top:26px}
@media(min-width:640px){
  html{font-size:17px}
  .hero h2{font-size:26px}
  .grammar-visual img{aspect-ratio:16/8}
}
@media(max-width:460px){
  .card{padding:16px}
  .practice-head{align-items:flex-start}
  .lesson-thumb{width:62px;height:52px}
  .search-row{flex-direction:column}
  .library-filter{width:100%}
  .listen-toggle{padding:6px 8px}
  .listen-toggle span{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="back" id="backBtn" aria-label="zurück">←</button>
    <h1 id="topTitle">Deutsch A2.2<small>Netzwerk neu · Buch & Grammatik</small></h1>
    <button type="button" class="listen-toggle" id="listenToggle" aria-pressed="false" title="اضغط ثم اختر أي نص لسماعه">
      🔊 <span>Hören</span>
    </button>
    <button type="button" class="ar-toggle" id="arToggle" role="switch" aria-label="Arabische Übersetzung">
      <span class="dot"></span><span>عربي</span>
    </button>
  </header>
  <main id="view"></main>
  <footer class="fnote">Netzwerk neu A2.2 (Kap. 7–12) · Grammatik-Skript A2 (Lektion 1–8)</footer>
</div>
<div class="speech-status" id="speechStatus" role="status"></div>

<script src="data_book1.js"></script>
<script src="data_book2.js"></script>
<script src="data_extra.js"></script>
<script src="data_enrichment.js"></script>
<script src="data_gram.js"></script>
<script src="data_gram_extra.js"></script>
<script>
/* ===================== state & helpers ===================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const view = $('#view');
const BOOK = [...window.BOOK1, ...window.BOOK2];
const GRAM = window.GRAM;
function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
}

/* Arabic toggle (persisted) */
function setAr(on){
  document.body.classList.toggle('show-ar', on);
  $('#arToggle').setAttribute('aria-checked', String(on));
  localStorage.setItem('showAr', on ? '1' : '0');
}
$('#arToggle').addEventListener('click', () => setAr(!document.body.classList.contains('show-ar')));
setAr(localStorage.getItem('showAr') !== '0');   // default ON

function ar(txt){ return txt ? `<div class="ar">${txt}</div>` : ''; }

/* ===================== speech ===================== */
const speech = window.speechSynthesis;
const listenToggle = $('#listenToggle');
let speechStatusTimer = null;

function cleanSpeechText(element){
  const copy=element.cloneNode(true);
  copy.querySelectorAll('.ar,.speak-btn,.answer-btn,.exercise-actions').forEach(node=>node.remove());
  return copy.textContent.replace(/\s+/g,' ').trim();
}

function showSpeechStatus(text){
  const status=$('#speechStatus');
  status.textContent=`🔊 ${text}`;
  status.classList.add('show');
  clearTimeout(speechStatusTimer);
  speechStatusTimer=setTimeout(()=>status.classList.remove('show'),2600);
}

function speakText(text, lang){
  const value=(text||'').replace(/\s+/g,' ').trim();
  if(!value) return;
  if(!speech){ showSpeechStatus('المتصفح لا يدعم القراءة الصوتية'); return; }
  speech.cancel();
  const utterance=new SpeechSynthesisUtterance(value);
  const isArabic=lang==='ar' || /[\u0600-\u06ff]/.test(value.slice(0,40));
  utterance.lang=isArabic?'ar-EG':'de-DE';
  utterance.rate=isArabic ? .92 : .86;
  const voices=speech.getVoices();
  utterance.voice=voices.find(v=>v.lang.toLowerCase().startsWith(isArabic?'ar':'de'))||null;
  utterance.onend=()=>$('#speechStatus').classList.remove('show');
  speech.speak(utterance);
  showSpeechStatus(value.slice(0,72));
}

function enhanceSpeech(root){
  const selector=[
    '.vocab-row .w','.vocab-row .def','.vocab-row .ex','.reading-text','.reading-q b',
    '.reading-answer','.reading-glossary span','.rm-item','.gram-block h3','.gram-block p',
    '.gram-block li','.gram-block td','.speak-q>div','.model-text','.quiz-q',
    '.exercise-prompt','.dictionary-word','.dictionary-definition','.dictionary-example',
    '.expression-de','.expression-meaning','.expression-example','.goal-item>div','.visual-caption',
    '.card>h3','.card>h4','.card>p','.intro-note'
  ].join(',');
  root.querySelectorAll(selector).forEach(element=>{
    if(element.dataset.speechReady) return;
    element.dataset.speechReady='1';
    element.classList.add('speakable');
    const button=document.createElement('button');
    button.type='button'; button.className='speak-btn'; button.textContent='🔊';
    button.setAttribute('aria-label','Vorlesen');
    button.addEventListener('click',event=>{
      event.preventDefault(); event.stopPropagation();
      speakText(cleanSpeechText(element),element.classList.contains('ar')?'ar':'de');
    });
    element.appendChild(button);
  });
  root.querySelectorAll('.ar').forEach(element=>{
    if(element.dataset.speechReady || !element.textContent.trim() || element.closest('button')) return;
    element.dataset.speechReady='1';
    element.classList.add('speakable');
    const button=document.createElement('button');
    button.type='button'; button.className='speak-btn'; button.textContent='🔊';
    button.setAttribute('aria-label','قراءة النص العربي');
    button.addEventListener('click',event=>{
      event.preventDefault(); event.stopPropagation();
      speakText(cleanSpeechText(element),'ar');
    });
    element.appendChild(button);
  });
}

listenToggle.addEventListener('click',()=>{
  const on=!document.body.classList.contains('listen-mode');
  document.body.classList.toggle('listen-mode',on);
  listenToggle.setAttribute('aria-pressed',String(on));
  if(!on && speech) speech.cancel();
  showSpeechStatus(on?'اضغط على أي نص لسماعه':'تم إيقاف وضع الاستماع');
});

view.addEventListener('click',event=>{
  if(!document.body.classList.contains('listen-mode') || event.target.closest('.speak-btn,input,select,.answer-btn,.exercise-check,.exercise-reset')) return;
  const target=event.target.closest('.speakable,.quiz-opt,.word-token,.tab,.lesson-item,h2,h3,h4,p,li,td,.badge');
  if(!target) return;
  event.preventDefault(); event.stopPropagation();
  speakText(cleanSpeechText(target),target.classList.contains('ar')?'ar':'de');
},true);

new MutationObserver(()=>enhanceSpeech(view)).observe(view,{childList:true,subtree:true});

/* ===================== router ===================== */
function go(hash){ location.hash = hash; }
window.addEventListener('hashchange', route);
$('#backBtn').addEventListener('click', () => {
  const h = location.hash;
  if(/^#(k|g)\d+\//.test(h)) go(h.split('/')[0]);   // tab -> lesson root? actually lesson root shows tabs
  else go('');
});

function route(){
  const h = location.hash.replace('#','');
  window.scrollTo(0,0);
  if(!h){ renderHome(); return; }
  if(h==='dict'){ renderDictionary(); return; }
  if(h==='phrases'){ renderExpressions(); return; }
  const m = h.match(/^(k|g)(\d+)(?:\/(\w+))?/);
  if(!m){ renderHome(); return; }
  if(m[1]==='k'){
    const ch = BOOK.find(c => c.num == m[2]);
    if(ch) renderChapter(ch, m[3]||'ueberblick'); else renderHome();
  } else {
    const lk = GRAM.find(l => l.num == m[2]);
    if(lk) renderLektion(lk, m[3]||'0'); else renderHome();
  }
}

function setTop(title, sub, hasBack){
  $('#topTitle').innerHTML = `${title}<small>${sub}</small>`;
  document.body.classList.toggle('has-back', !!hasBack);
}

const TABS = [
  ['ueberblick','📋 Überblick'],
  ['wortschatz','📖 Wortschatz'],
  ['lesen','📚 Lesen'],
  ['redemittel','💬 Redemittel'],
  ['grammatik','✏️ Grammatik'],
  ['sprechen','🗣️ Sprechen'],
  ['quiz','🎯 Quiz'],
];

function renderChapter(c, tab){
  setTop(`Kapitel ${c.num}: ${c.title}`, c.subtitle, true);
  let html = `<div class="tabs">` + TABS.map(([id,lbl]) =>
    `<button class="tab ${id===tab?'active':''}" onclick="go('k${c.num}/${id}')">${lbl}</button>`).join('') + `</div>`;
  html += renderChapterTab(c, tab);
  view.innerHTML = html;
  if(tab==='wortschatz') initFlash(c);
  if(tab==='quiz') initQuiz(c.quiz);
}

    <div class="intro-note">💡 <b>Tipp:</b> Lies zuerst den Wortschatz, dann die Redemittel. Sprich die Sätze laut!
    Am Ende mach das Quiz.${ar('نصيحة: ابدأ بالمفردات، وبعدها جُمل الكلام واقرأها بصوت عالي، وبعدين القواعد، وفي الآخر حل الكويز.')}</div>`;

      <button class="btn btn-ghost" id="fcStop" style="display:none">📃 Liste zeigen</button>

      g.items.forEach(i => h += `<div class="rm-item">${i.de}${ar(i.ar)}</div>`);

  }
  if(tab==='lesen'){

function fmtWord(w){
  return w.replace(/^(der|die|das)\s/, '<span class="art">$1</span> ');
}

function toggleReadingAnswer(btn){
  const answer = btn.nextElementSibling;
  const show = !answer.classList.contains('show');
  answer.classList.toggle('show', show);
  btn.textContent = show ? 'Antwort ausblenden' : 'Antwort zeigen';
}

/* ===================== flashcards ===================== */
let fcState = null;
function initFlash(c){
  const start = $('#fcStart'), stop = $('#fcStop'), area = $('#fcArea'), list = $('#vocList');
  start.addEventListener('click', () => {
    fcState = {cards:[...c.vocab].sort(()=>Math.random()-.5), i:0, flipped:false};
    list.style.display='none'; start.style.display='none'; stop.style.display='block';
    drawFC();
  });
  stop.addEventListener('click', () => {
    fcState=null; list.style.display='block'; start.style.display='block'; stop.style.display='none';
    area.innerHTML='';
  });
}
function drawFC(){
  const a = $('#fcArea'); if(!fcState) return;
  const v = fcState.cards[fcState.i];
  a.innerHTML = `
  <div class="flashcard" onclick="flipFC()">
    ${!fcState.flipped
      ? `<div class="big">${fmtWord(v.w)}</div><div class="hint">👆 Tippen = Erklärung zeigen</div>`
      : `<div class="big" style="font-size:19px">${fmtWord(v.w)}</div>
         <div class="fdef">💡 ${v.d}</div>
         ${v.ex?`<div class="fex">„${v.ex}“</div>`:''}
         ${ar(v.ar)}`}
  </div>
  <div class="fc-nav">
    <button class="btn btn-ghost" onclick="navFC(-1)">← zurück</button>
    <span class="cnt">${fcState.i+1} / ${fcState.cards.length}</span>
    <button class="btn btn-green" onclick="navFC(1)">weiter →</button>
  </div>`;
}
function flipFC(){ fcState.flipped=!fcState.flipped; drawFC(); }
function navFC(d){
  fcState.i = (fcState.i + d + fcState.cards.length) % fcState.cards.length;
  fcState.flipped=false; drawFC();
}

/* ===================== quiz ===================== */
function initQuiz(questions){
  const area = $('#quizArea');
  let score=0, answered=0;
  let h='';
  questions.forEach((q,qi) => {
    h += `<div class="card"><div class="quiz-q">${qi+1}. ${q.q}</div>`;
    q.o.forEach((opt,oi) => {
      h += `<button class="quiz-opt" data-q="${qi}" data-o="${oi}">${opt}</button>`;
    });
    h += `<div class="quiz-fb" id="fb${qi}"></div></div>`;
  });
  h += `<div class="card quiz-score" id="qscore">Beantworte alle Fragen! 💪</div>`;
  area.innerHTML = h;
  area.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const qi=+btn.dataset.q, oi=+btn.dataset.o, q=questions[qi];
      if(btn.parentElement.dataset.done) return;
      btn.parentElement.dataset.done='1';
      answered++;
      const fb = $('#fb'+qi);
      btn.parentElement.querySelectorAll('.quiz-opt').forEach((b,i)=>{
        if(i===q.a) b.classList.add('correct');
      });
      if(oi===q.a){ score++; fb.innerHTML=`✅ Richtig! ${q.fb||''}${ar(q.fbAr)}`; }
      else { btn.classList.add('wrong'); fb.innerHTML=`❌ Nicht ganz. ${q.fb||''}${ar(q.fbAr)}`; }
      fb.classList.add('show');
      if(answered===questions.length){
        $('#qscore').innerHTML = `🏆 Dein Ergebnis: ${score} / ${questions.length}` +
          (score===questions.length?' – Perfekt!':score>=questions.length*0.6?' – Gut gemacht!':' – Wiederhole die Lektion noch einmal!');
      }
    });
  });
}

/* ===================== grammar lektion (skript) ===================== */
function renderLektion(l, topicIdx){
  setTop(`Lektion ${l.num} (Skript)`, l.topics.map(t=>t.short).join(' · '), true);
  const ti = parseInt(topicIdx)||0;
  let html = `<div class="tabs">` + l.topics.map((t,i) =>
    `<button class="tab ${i===ti?'active':''}" onclick="go('g${l.num}/${i}')">${l.num}.${i+1} ${t.short}</button>`).join('') + `</div>`;
  const t = l.topics[ti];
  if(t.visual){
    html += `<figure class="card grammar-visual">
      <img src="${t.visual.src}" alt="${t.visual.alt}">
      <figcaption class="visual-caption">${t.visual.caption}${ar(t.visual.captionAr)}</figcaption>
    </figure>`;
  }
  html += `<div class="card gram-block"><h3>${l.num}.${ti+1}. ${t.title}</h3>${ar(t.titleAr)}${t.body}</div>`;
  if(t.quiz){
    html += `<div class="section-label">🎯 Schnelltest</div><div id="quizArea"></div>`;
  }
  if(t.practice?.length){
    html += `<div class="practice-head"><h3>Interaktive Übungen</h3>
      <span class="practice-progress" id="practiceProgress">0 / ${t.practice.length} geschafft</span></div>
      <div id="practiceArea"></div>`;
  }
  view.innerHTML = html;
  if(t.quiz) initQuiz(t.quiz);
  if(t.practice?.length) initPractice(t.practice, `${l.num}-${ti}`);
}

function normalizeAnswer(value){
  return value.toLocaleLowerCase('de-DE').replace(/[.,!?;:„“"']/g,'').replace(/\s+/g,' ').trim();
}

function exerciseLabel(type){
  return `<span class="exercise-type type-label-${type}"></span>`;
}

function initPractice(exercises, practiceId){
  const area = $('#practiceArea');
  const saved = JSON.parse(localStorage.getItem(`grammarPractice:${practiceId}`) || '{}');
  area.innerHTML = exercises.map((ex,i) => {
    if(ex.type==='order'){
      return `<div class="card exercise-card" data-ex="${i}">
        ${exerciseLabel(ex.type)}<div class="exercise-prompt">${ex.prompt}</div>
        <div class="token-bank">${ex.tokens.map((token,ti)=>`<button class="word-token" data-token="${ti}">${token}</button>`).join('')}</div>
        <div class="order-answer" aria-label="Deine Antwort"></div>
        <div class="exercise-actions"><button class="exercise-check">Prüfen</button><button class="exercise-reset">Neu ordnen</button></div>
        <div class="exercise-feedback"></div></div>`;
    }
    return `<div class="card exercise-card" data-ex="${i}">
      ${exerciseLabel(ex.type)}<div class="exercise-prompt">${ex.prompt}</div>
      <input class="exercise-input" autocomplete="off" placeholder="Antwort schreiben …">
      <div class="exercise-actions"><button class="exercise-check">Prüfen</button></div>
      <div class="exercise-feedback"></div></div>`;
  }).join('');

  area.querySelectorAll('.exercise-card').forEach(card => {
    const index = +card.dataset.ex;
    const exercise = exercises[index];
    const accepted = Array.isArray(exercise.answer) ? exercise.answer : [exercise.answer];
    const feedback = card.querySelector('.exercise-feedback');
    const setFeedback = correct => {
      feedback.className = `exercise-feedback show ${correct?'correct':'wrong'}`;
      feedback.innerHTML = correct
        ? `✓ Richtig!${ar('إجابة صحيحة')}`
        : `Noch nicht. Musterlösung: <b>${accepted[0]}</b>${exercise.hint?`<br><small>${exercise.hint}</small>`:''}${ar('راجع ترتيب الكلمات أو النهاية ثم حاول مرة ثانية.')}`;
      if(correct){
        saved[index]=true;
        localStorage.setItem(`grammarPractice:${practiceId}`, JSON.stringify(saved));
        updatePracticeProgress(exercises.length, saved);
      }
    };

    if(exercise.type==='order'){
      const answerBox = card.querySelector('.order-answer');
      card.querySelectorAll('.word-token').forEach(btn => btn.addEventListener('click', () => {
        btn.disabled=true;
        const chosen=document.createElement('button');
        chosen.className='word-token'; chosen.textContent=btn.textContent;
        chosen.addEventListener('click',()=>{ btn.disabled=false; chosen.remove(); });
        answerBox.appendChild(chosen);
      }));
      card.querySelector('.exercise-reset').addEventListener('click',()=>{
        answerBox.innerHTML='';
        card.querySelectorAll('.token-bank .word-token').forEach(btn=>btn.disabled=false);
        feedback.className='exercise-feedback';
      });
      card.querySelector('.exercise-check').addEventListener('click',()=>{
        const value=[...answerBox.querySelectorAll('.word-token')].map(btn=>btn.textContent).join(' ');
        setFeedback(accepted.some(a=>normalizeAnswer(a)===normalizeAnswer(value)));
      });
    } else {
      const input=card.querySelector('.exercise-input');
      card.querySelector('.exercise-check').addEventListener('click',()=>{
        setFeedback(accepted.some(a=>normalizeAnswer(a)===normalizeAnswer(input.value)));
      });
      input.addEventListener('keydown',event=>{ if(event.key==='Enter') card.querySelector('.exercise-check').click(); });
    }
  });
  updatePracticeProgress(exercises.length, saved);
}

function updatePracticeProgress(total, saved){
  const done=Object.values(saved).filter(Boolean).length;
  const progress=$('#practiceProgress');
  if(progress) progress.textContent=`${done} / ${total} geschafft`;
}

route();
</script>
</body>
</html>
